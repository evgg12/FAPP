# Configuration for the web-slice tests only.
#
# Persistence is excluded so a controller test does not need a database. Nothing that
# depends on the persistence layer can load under this profile, so any test of the real
# application context uses AbstractPostgresTest and a real PostgreSQL instead.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
